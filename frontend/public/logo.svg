<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  
  <!-- Subtle inner light -->
  <rect width="32" height="32" rx="7" fill="url(#light)" opacity="0.15"/>
  <defs>
    <linearGradient id="light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Search circle -->
  <circle cx="13" cy="13" r="8.5" stroke="white" stroke-width="2.2" fill="none"/>
  
  <!-- Play triangle inside -->
  <path d="M10.5 9.5L16.5 13L10.5 16.5V9.5Z" fill="white"/>
  
  <!-- Search handle -->
  <path d="M19.5 19.5L25.5 25.5" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- AI sparkle dot -->
  <circle cx="26" cy="6" r="1.5" fill="white" opacity="0.9"/>
</svg>